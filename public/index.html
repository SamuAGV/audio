<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Audios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
        #audioList {
            margin-top: 20px;
        }
        .audio-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #fileInfo {
            margin: 10px 0;
            font-style: italic;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Subir Audios desde tu Dispositivo</h1>
    
    <div>
        <input type="file" id="audioInput" accept="audio/*" class="hidden">
        <button id="selectBtn">Seleccionar Audio</button>
        <button id="uploadBtn" disabled>Subir Audio</button>
    </div>
    
    <div id="fileInfo"></div>
    
    <audio id="audioPreview" controls style="width: 100%; margin: 10px 0;" class="hidden"></audio>
    
    <div>
        <label for="audioName">Nombre para el audio:</label>
        <input type="text" id="audioName" placeholder="Nombre del audio" disabled>
    </div>
    
    <h2>Audios Guardados</h2>
    <div id="audioList"></div>
    
    <script>
        // Elementos del DOM
        const audioInput = document.getElementById('audioInput');
        const selectBtn = document.getElementById('selectBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInfo = document.getElementById('fileInfo');
        const audioPreview = document.getElementById('audioPreview');
        const audioName = document.getElementById('audioName');
        const audioList = document.getElementById('audioList');
        
        let selectedFile = null;
        
        // Cargar lista de audios al iniciar
        window.addEventListener('load', loadAudioList);
        
        // Seleccionar archivo
        selectBtn.addEventListener('click', () => {
            audioInput.click();
        });
        
        audioInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            
            if (!file) return;
            
            // Validar que sea un archivo de audio
            if (!file.type.startsWith('audio/')) {
                alert('Por favor selecciona un archivo de audio válido');
                return;
            }
            
            selectedFile = file;
            
            // Mostrar información del archivo
            fileInfo.textContent = `Archivo seleccionado: ${file.name} (${formatFileSize(file.size)})`;
            
            // Habilitar botón de subir
            uploadBtn.disabled = false;
            audioName.disabled = false;
            
            // Previsualizar el audio
            const audioURL = URL.createObjectURL(file);
            audioPreview.src = audioURL;
            audioPreview.classList.remove('hidden');
            
            // Sugerir nombre basado en el archivo (sin extensión)
            const fileNameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
            audioName.value = fileNameWithoutExt;
        });
        
        // Subir archivo
        uploadBtn.addEventListener('click', () => {
            if (!selectedFile) return;
            
            const name = audioName.value.trim() || selectedFile.name;
            const extension = selectedFile.name.split('.').pop();
            const fileName = `${name}.${extension}`;
            
            const formData = new FormData();
            formData.append('audio', selectedFile, fileName);
            
            fetch('/upload-audio', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Audio subido correctamente');
                    loadAudioList();
                    resetUploader();
                } else {
                    alert('Error al subir el audio: ' + (data.message || ''));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error al subir el audio');
            });
        });
        
        function resetUploader() {
            audioInput.value = '';
            selectedFile = null;
            fileInfo.textContent = '';
            audioPreview.src = '';
            audioPreview.classList.add('hidden');
            uploadBtn.disabled = true;
            audioName.disabled = true;
            audioName.value = '';
        }
        
        function loadAudioList() {
            fetch('/get-audios')
                .then(response => response.json())
                .then(audios => {
                    audioList.innerHTML = '';
                    
                    if (audios.length === 0) {
                        audioList.innerHTML = '<p>No hay audios guardados aún.</p>';
                        return;
                    }
                    
                    audios.forEach(audio => {
                        const audioItem = document.createElement('div');
                        audioItem.className = 'audio-item';
                        
                        const audioElement = document.createElement('audio');
                        audioElement.controls = true;
                        audioElement.src = `/audios/${encodeURIComponent(audio)}`;
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Eliminar';
                        deleteBtn.onclick = () => deleteAudio(audio);
                        
                        audioItem.innerHTML = `<p>${audio}</p>`;
                        audioItem.appendChild(audioElement);
                        audioItem.appendChild(deleteBtn);
                        
                        audioList.appendChild(audioItem);
                    });
                })
                .catch(error => {
                    console.error('Error al cargar audios:', error);
                    audioList.innerHTML = '<p>Error al cargar la lista de audios.</p>';
                });
        }
        
        function deleteAudio(filename) {
            if (confirm(`¿Seguro que quieres eliminar "${filename}"?`)) {
                fetch(`/delete-audio/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        loadAudioList();
                    } else {
                        alert('Error al eliminar el audio');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error al eliminar el audio');
                });
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
